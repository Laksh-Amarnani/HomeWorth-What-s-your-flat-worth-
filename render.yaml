services:
  - type: web
    name: homeworth
    runtime: docker
    plan: free
    region: singapore        # closest Render region to India
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ADMIN_KEY
        generateValue: true   # read it from the Render dashboard; it is the password for /leads.csv
      - key: LEAD_WEBHOOK_URL
        sync: false           # paste a Slack or Discord webhook URL in the dashboard
